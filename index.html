<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate | Student Notes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7ff;
    color: #202747;
}

header {
    background: #ffffff;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px #00000010;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #5145cd;
}

nav a {
    text-decoration: none;
    color: #303750;
    margin-left: 20px;
}

.hero {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(135deg, #5145cd, #8175f5);
    color: white;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
    margin-bottom: 25px;
}

.search {
    width: 90%;
    max-width: 520px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

h2 {
    margin-bottom: 20px;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 25px;
}

select, input, textarea {
    padding: 12px;
    border: 1px solid #d8dcef;
    border-radius: 8px;
    font: inherit;
}

.filters select {
    background: white;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00000008;
}

.card h3 {
    margin: 12px 0;
}

.card p {
    color: #666d82;
    margin-bottom: 15px;
    line-height: 1.5;
}

.tag {
    display: inline-block;
    background: #eeecff;
    color: #5145cd;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
}

button, .download {
    display: inline-block;
    border: none;
    background: #5145cd;
    color: white;
    padding: 11px 15px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    font-size: 14px;
}

button:hover, .download:hover {
    background: #3930a5;
}

.delete {
    background: #d94152;
    margin-left: 5px;
}

.add-section {
    margin-top: 45px;
    background: white;
    padding: 25px;
    border-radius: 14px;
}

form {
    display: grid;
    gap: 14px;
}

form input, form select, form textarea {
    width: 100%;
}

footer {
    margin-top: 50px;
    text-align: center;
    background: #202747;
    color: white;
    padding: 25px;
}

#empty {
    color: #777;
    margin-top: 15px;
}

@media (max-width: 600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 7px;
        font-size: 14px;
    }

    .hero h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">📚 StudyMate</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#notes">Notes</a>
        <a href="#add">Add Notes</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Your Learning, Simplified!</h1>
    <p>Find your notes, prepare for exams and learn smarter.</p>
    <input
        class="search"
        id="search"
        type="search"
        placeholder="Search notes or subjects..."
        aria-label="Search notes"
    >
</section>

<main class="container" id="notes">
    <h2>Explore Student Notes 📖</h2>

    <div class="filters">
        <select id="subjectFilter" aria-label="Filter by subject">
            <option value="">All Subjects</option>
            <option>Computer Science</option>
            <option>Mathematics</option>
            <option>English</option>
            <option>Physics</option>
            <option>Programming</option>
        </select>

        <select id="semesterFilter" aria-label="Filter by semester">
            <option value="">All Semesters</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
        </select>
    </div>

    <div class="grid" id="notesGrid"></div>
    <p id="empty" hidden>No notes found. Try another search.</p>

    <section class="add-section" id="add">
        <h2>➕ Add Your Own Notes</h2>
        <p style="margin-bottom:20px;color:#666">
            Add notes to your personal StudyMate collection.
        </p>

        <form id="notesForm">
            <input id="title" placeholder="Note title" required>

            <select id="subject" required>
                <option value="">Select Subject</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>English</option>
                <option>Physics</option>
                <option>Programming</option>
            </select>

            <select id="semester" required>
                <option value="">Select Semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <textarea
                id="content"
                rows="5"
                placeholder="Write your notes here..."
                required
            ></textarea>

            <button type="submit">Save Notes</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 StudyMate | Learn Better, Achieve More 🎓</p>
</footer>

<script>
const starterNotes = [
    {
        id: "sample1",
        title: "Introduction to Computer Science",
        subject: "Computer Science",
        semester: "1",
        content: "Computer science is the study of computers, algorithms, software and information processing."
    },
    {
        id: "sample2",
        title: "Basic Mathematics",
        subject: "Mathematics",
        semester: "1",
        content: "Mathematics includes numbers, algebra, equations and problem-solving techniques."
    },
    {
        id: "sample3",
        title: "English Grammar",
        subject: "English",
        semester: "1",
        content: "Grammar covers parts of speech, sentence structure, tenses and punctuation."
    },
    {
        id: "sample4",
        title: "Programming Fundamentals",
        subject: "Programming",
        semester: "1",
        content: "Programming means writing instructions for a computer using a programming language."
    }
];

let notes = [];

try {
    const saved = localStorage.getItem("studymateNotes");
    notes = saved ? JSON.parse(saved) : starterNotes;
    if (!Array.isArray(notes)) notes = starterNotes;
} catch (error) {
    notes = starterNotes;
}

const grid = document.getElementById("notesGrid");
const search = document.getElementById("search");
const subjectFilter = document.getElementById("subjectFilter");
const semesterFilter = document.getElementById("semesterFilter");
const empty = document.getElementById("empty");

function saveNotes() {
    try {
        localStorage.setItem("studymateNotes", JSON.stringify(notes));
        return true;
    } catch (error) {
        alert("Notes could not be saved. Check your browser storage.");
        return false;
    }
}

function renderNotes() {
    const query = search.value.toLowerCase().trim();
    const selectedSubject = subjectFilter.value;
    const selectedSemester = semesterFilter.value;

    const filtered = notes.filter(note =>
        (note.title + " " + note.subject + " " + note.content)
            .toLowerCase().includes(query) &&
        (!selectedSubject || note.subject === selectedSubject) &&
        (!selectedSemester || note.semester === selectedSemester)
    );

    grid.replaceChildren();
    empty.hidden = filtered.length !== 0;

    filtered.forEach(note => {
        const card = document.createElement("article");
        card.className = "card";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = note.subject;

        const heading = document.createElement("h3");
        heading.textContent = note.title;

        const semester = document.createElement("p");
        semester.textContent = "Semester " + note.semester;

        const content = document.createElement("p");
        content.textContent = note.content;

        const download = document.createElement("button");
        download.textContent = "Download TXT";
        download.type = "button";
        download.onclick = () => downloadNote(note);

        card.append(tag, heading, semester, content, download);

        if (!String(note.id).startsWith("sample")) {
            const remove = document.createElement("button");
            remove.className = "delete";
            remove.textContent = "Delete";
            remove.type = "button";
            remove.onclick = () => {
                if (confirm("Delete this note?")) {
                    notes = notes.filter(item => item.id !== note.id);
                    if (saveNotes()) renderNotes();
                }
            };
            card.appendChild(remove);
        }

        grid.appendChild(card);
    });
}

function downloadNote(note) {
    const text = [
        note.title,
        "Subject: " + note.subject,
        "Semester: " + note.semester,
        "",
        note.content
    ].join("\n");

    const blob = new Blob([text], {
        type: "text/plain;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = note.title.replace(/[^a-z0-9_-]/gi, "_") + ".txt";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("notesForm").addEventListener("submit", event => {
    event.preventDefault();

    const note = {
        id: "note_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        title: document.getElementById("title").value.trim(),
        subject: document.getElementById("subject").value,
        semester: document.getElementById("semester").value,
        content: document.getElementById("content").value.trim()
    };

    if (!note.title || !note.subject || !note.semester || !note.content) {
        alert("Please complete all fields.");
        return;
    }

    notes.push(note);

    if (saveNotes()) {
        event.target.reset();
        renderNotes();
        alert("Your notes have been saved!");
        document.getElementById("notes").scrollIntoView({
            behavior: "smooth"
        });
    } else {
        notes.pop();
    }
});

search.addEventListener("input", renderNotes);
subjectFilter.addEventListener("change", renderNotes);
semesterFilter.addEventListener("change", renderNotes);

renderNotes();
</script>

</body>
</html>
